spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    baseline-on-migrate: true
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:https://mypet.onrender.com}
server:
  port: ${PORT:8080}
