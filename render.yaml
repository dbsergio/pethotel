services:
  - type: web
    name: mypet-backend
    env: docker
    plan: free
    region: oregon
    dockerContext: backend
    dockerfilePath: Dockerfile
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: CORS_ALLOWED_ORIGINS
        value: https://mypet-frontend.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: mypet-db
          property: connectionString
      - key: DATABASE_USERNAME
        fromDatabase:
          name: mypet-db
          property: user
      - key: DATABASE_PASSWORD
        fromDatabase:
          name: mypet-db
          property: password

  - type: web
    name: mypet-frontend
    env: static
    plan: free
    region: oregon
    buildCommand: chmod +x ./render_build.sh && ./render_build.sh
    staticPublishPath: frontend/build/web
    envVars:
      - key: API_URL
        value: https://mypet-backend.onrender.com/api/game/sync

databases:
  - name: mypet-db
    plan: free
    region: oregon
