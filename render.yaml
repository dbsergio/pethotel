services:
  - type: web
    name: mypet-backend
    env: docker
    plan: free
    region: oregon
    dockerContext: backend
    dockerfilePath: Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: CORS_ALLOWED_ORIGINS
        value: "*" # To be updated later when frontend URL is generated
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DATABASE
        value: mypethotel
      - key: JWT_SECRET
        sync: false
